<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <meta name="description" content="Browse NASA's Astronomy Picture of the Day by date range." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- LevelUp: random space fact -->
    <section class="fact-box" aria-labelledby="fact-heading">
      <h2 id="fact-heading">&#128640; Did You Know?</h2>
      <p id="space-fact"></p>
    </section>

    <div class="filters">
      <div class="field">
        <label for="startDate">Start date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="field">
        <label for="endDate">End date</label>
        <input type="date" id="endDate" />
      </div>
      <button id="getImagesBtn" type="button">Get Space Images</button>
    </div>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <footer class="site-footer">
      <p>Images and text from NASA's <a href="https://science.nasa.gov/apod/" target="_blank" rel="noopener">Astronomy Picture of the Day<span class="visually-hidden"> (opens in a new tab)</span></a>. A student project, not an official NASA site.</p>
    </footer>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-content">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modal-media" class="modal-media"></div>
      <div class="modal-text">
        <h2 id="modal-title"></h2>
        <p id="modal-date" class="modal-date"></p>
        <p id="modal-credit" class="modal-credit" hidden></p>
        <p id="modal-explanation"></p>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
